name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:            # tests JS : rapides, sans SDK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # création de la Release GitHub (étape réservée à main)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: OpenPlay-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Publier l'APK en Release GitHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk OpenPlay.apk
          gh release create "build-${{ github.run_number }}" OpenPlay.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OpenPlay – build ${{ github.run_number }}" \
            --notes "APK de test : signé avec la clé de débogage Expo, processeurs arm64-v8a. Commit ${{ github.sha }}." \
            --latest
